baseurl = "/"
languageCode = "en"
title = "CFEngine Build"
theme = "cfbs-theme"

enableRobotsTXT = true
syntaxCSS = true

# this parameter is set by Hugo from HUGO_PARAMS_SEARCHENGINES_DISABLED environment variable
# that we define on the build stage
# it is false by defaut to avoid a case when it was accedntly not defined
[params.searchengines]
disabled = false 

# Number of posts per page
[pagination]
pagerSize = 10

[params]
# Used as the summary line in llms.txt
description = "CFEngine Build is the catalog of modules for CFEngine. Browse modules that extend CFEngine with new policy, promise types, inventory and reports, and add them to your project with the cfbs command line tool."

[params.info]
homeTitle = "CFEngine Build" # Title for home page

[params.featured]
modules = ['packages-allowlist-snapshot', 'delete-files', 'promise-type-docker-compose']

[taxonomies]
tag = "tags"
author = "author"

[params.sitemap]
baseUrl = "https://build.cfengine.com"
[markup]
	[markup.highlight]
		noClasses = false

# Hugo 0.162+ blocks text/html content files by default
# so explicitly allow the content media types we use
[security]
allowContent = ['^text/(html|markdown|org)$']

[params.gitProviders.repositoryLinkTemplates]
"github.com"    = "%s/tree/%s/%s"
"gitlab.com"    = "%s/-/tree/%s/%s"
"bitbucket.org" = "%s/src/%s/%s"
"codeberg.org"  = "%s/src/commit/%s/%s"

# llms.txt (https://llmstxt.org), see
# https://github.com/gethugothemes/hugo-modules/tree/main/llms-txt
[module]
[[module.imports]]
path = "github.com/gethugothemes/hugo-modules/llms-txt"

[outputs]
home = ["HTML", "RSS", "llms", "llmsfull", "md"]
section = ["HTML", "RSS", "md"]
page = ["HTML", "md"]

[params.llms]
generate_llms_txt = true
generate_llms_full_txt = true
include = []
exclude = ["/tags/**", "/author/**"]
