variables:
  DOCKER_REPOSITORY: registry.mender.io/cfengine/cfbuild
  DOCKERFILE: Dockerfile
  MULTIPLATFORM_BUILD: "true"
  MULTIPLATFORM_PLATFORMS: "linux/amd64" # Hugo binary in the Dockerfile is amd64-only
  # build.js authenticates to the GitHub API with this token to avoid rate limits.
  # The multiplatform buildx job reads EXTRA_DOCKER_ARGS (not the legacy inline
  # --build-arg), so pass the token through there.
  EXTRA_DOCKER_ARGS: "--build-arg GITHUB_USERNAME_TOKEN"
  DOCKER_HOST:
    value: 'tcp://docker:2376'
    description: "Required to run dind inside k8s runners with TLS"
  DOCKER_TLS_CERTDIR:
    value: '/certs'
    description: "The cert dir inside the gitlab runner. Don't change this."
  DOCKER_TLS_VERIFY:
    value: "1"
    description: "Enable TLS verification for docker in dind"
  DOCKER_CERT_PATH:
    value: "$DOCKER_TLS_CERTDIR/client"
    description: "Used for docker entrypoints. See https://gitlab.com/gitlab-org/gitlab-runner/-/issues/4125"

include:
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-docker-build.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-docker-deploy.yml'

stages:
  - build
  - publish
  - sync

# QA-1487 deprecated build:docker/publish:image (their scripts now exit 1). Opt
# into the buildx multiplatform variants and disable the legacy and mender jobs.
build:docker:
  rules:
    - when: never

build:docker-multiplatform:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(master|production)$/'

publish:image:
  rules:
    - when: never

publish:image-multiplatform:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(master|production)$/'

publish:image:mender:
  rules:
    - when: never

publish:image-multiplatform:mender:
  rules:
    - when: never

sync:image:
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  variables:
    TARGET_MANIFEST_FILE: "kubernetes/build-cfengine-com/build-cfengine-com-deployment.yaml"

sync:image:staging:
  extends: sync:image
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  variables:
    TARGET_MANIFEST_FILE: "kubernetes/staging-build-cfengine-com/staging-build-cfengine-com-deployment.yaml"
